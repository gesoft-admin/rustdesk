name: Support Windows x64 Build

# Windows x64-only build for this support fork. Stock RustDesk UI; the custom
# rendezvous server and public key come in through libs/hbb_common.
#
# The steps below are the x64 leg of `build-for-windows-flutter` in
# flutter-build.yml, with the arm64 branches, signing, MSI and release publishing
# removed. flutter-build.yml is workflow_call-only and has no platform selector,
# so it cannot be reused here without editing it; the two reusable workflows it
# depends on (bridge, RustDeskTempTopMostWindow) are called directly instead.
#
# Keep the pinned action SHAs and tool versions in sync with flutter-build.yml
# when merging upstream.

on:
  workflow_dispatch:
  push:
    branches:
      - support
    paths-ignore:
      - "docs/**"
      - "**/*.md"

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  # One build for the live and the lab helpdesk: the profiles are compiled
  # from src/gesoft_profile.rs, and the download name selects one.
  GESOFT_SUPPORT_BUILD: "1"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-x64:
    name: x86_64-pc-windows-msvc
    needs: [generate-bridge, build-RustDeskTempTopMostWindow]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Name the support build's runner after Gesoft Support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Version info of the extracted GesoftSupport.exe. Only the identity
          # strings change; version numbers, binary name and icon stay upstream's.
          rc = Path('flutter/windows/runner/Runner.rc')
          text = rc.read_text(encoding='utf-8')
          values = {
              'CompanyName': 'Gesoft',
              'FileDescription': 'Gesoft Support - asistenta la distanta',
              'InternalName': 'GesoftSupport',
              'LegalCopyright': 'Copyright \u00a9 2026 Purslane Tech Pte. Ltd. All rights reserved. Modifications Copyright \u00a9 2026 Gesoft. AGPL-3.0.',
              'OriginalFilename': 'GesoftSupport.exe',
              'ProductName': 'Gesoft Support',
          }
          lines = text.split('\n')
          for key, value in values.items():
              prefix = f'VALUE "{key}", "'
              hits = [i for i, line in enumerate(lines) if line.strip().startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'Runner.rc: expected one {key}, found {len(hits)}')
              i = hits[0]
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              eol = '\r' if lines[i].endswith('\r') else ''
              lines[i] = f'{indent}VALUE "{key}", "{value}" "\\0"{eol}'
          rc.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      # Must land in ./rustdesk before the portable packer runs, so the packed exe carries it too.
      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # The self-extractor names its target directory after the payload
          # executable's stem (libs/portable app_dir_name), so packing rustdesk.exe
          # would extract into %LOCALAPPDATA%\rustdesk and wipe a customer's own
          # portable RustDesk there. Rename the payload exe so extraction lands in
          # its own namespace (%LOCALAPPDATA%\gesoftsupport) instead.
          mv ./rustdesk/rustdesk.exe ./rustdesk/GesoftSupport.exe
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/GesoftSupport.exe
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe ./dist/rustdesk-${{ env.VERSION }}-x86_64-portable.exe

      - name: Mark and verify integrated support artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # Live's endpoints, from the one source the client and the packer
          # compile. Lab has none in the build: they come from lab.conf on the
          # test machine, so the marker only says that the lab profile exists.
          source = Path('src/gesoft_profile.rs').read_text(encoding='utf-8')
          live = {}
          for field in ('API_BASE', 'RENDEZVOUS', 'KEY'):
              found = re.findall(rf'pub const LIVE_{field}: &str = "([^"]+)";', source)
              if len(found) != 1:
                  raise SystemExit(f'Could not read LIVE_{field} from src/gesoft_profile.rs')
              live[field] = found[0]
          dll = Path('rustdesk/librustdesk.dll').read_bytes()
          for field, value in live.items():
              if value.encode('ascii') not in dll:
                  raise SystemExit(f'RustDesk DLL lacks the live {field}')
          exe = Path('dist/rustdesk-${{ env.VERSION }}-x86_64-portable.exe')
          data = exe.read_bytes()
          if b'HELPDESK-API-BASE:' in data or b'HELPDESK-PROFILES:' in data:
              raise SystemExit('Portable executable already contains a helpdesk marker')
          marker = ('HELPDESK-PROFILES:v2;'
                    f"live={live['API_BASE']}|{live['RENDEZVOUS']}|{live['KEY']};lab=local\0").encode('ascii')
          # The PE packer stores its compressed payload in a linked section.
          # This constant trailer lets Helpdesk check the profiles of the file it
          # serves without changing the payload or introducing a per-session hash.
          # It is appended before any signing, so a signature covers it.
          exe.write_bytes(data + marker)
          if exe.read_bytes().count(b'HELPDESK-PROFILES:') != 1:
              raise SystemExit('Portable profile marker verification failed')
          # Both executables carry Gesoft Support's version info.
          for path in (exe, Path('rustdesk/GesoftSupport.exe')):
              blob = path.read_bytes()
              for value in ('Gesoft Support', 'GesoftSupport.exe'):
                  if value.encode('utf-16-le') not in blob:
                      raise SystemExit(f'{path} lacks the version string {value}')
          PY

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-support-windows-x86_64
          path: |
            dist
            rustdesk

      # Experiment, not shipped: the same payload packed uncompressed, so the
      # two executables can be scanned side by side by Defender. It runs after
      # the real artifact is uploaded and cannot fail the job.
      - name: Build stored (uncompressed) executable for comparison
        id: stored
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          pushd ./libs/portable
          # --package writes data.bin only: app_metadata.toml keeps the shipped
          # build's timestamp and no second cargo build starts from generate.py.
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/GesoftSupport.exe --stored --package data.bin
          python3 -c 'import generate; generate.build_portable(".", None)'
          popd
          mkdir -p ./experimental
          cp ./target/release/rustdesk-portable-packer.exe ./experimental/rustdesk-${{ env.VERSION }}-x86_64-portable-stored.exe
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          shipped = Path('dist/rustdesk-${{ env.VERSION }}-x86_64-portable.exe').read_bytes()
          exe = Path('experimental/rustdesk-${{ env.VERSION }}-x86_64-portable-stored.exe')
          data = exe.read_bytes()
          if b'HELPDESK-API-BASE:' in data or b'HELPDESK-PROFILES:' in data:
              raise SystemExit('Stored executable already contains a helpdesk marker')
          if b'rdpack02\x00rustdesk' not in data:
              raise SystemExit('Stored executable does not embed the stored payload')

          # Every file decodes to exactly what the shipped build packs.
          blob = Path('libs/portable/data.bin').read_bytes()
          if blob[:9] != b'rdpack02\x00' or blob[9:17] != b'rustdesk':
              raise SystemExit('data.bin is not a stored blob')
          i, count = 17, 0
          while blob[i:i + 8] != b'rustdesk':
              n = int.from_bytes(blob[i:i + 4], 'big'); i += 4
              path = blob[i:i + n].decode(); i += n
              n = int.from_bytes(blob[i:i + 4], 'big'); i += 4
              content = blob[i:i + n]; i += n
              md5 = blob[i:i + 32].decode(); i += 32
              if hashlib.md5(content).hexdigest() != md5:
                  raise SystemExit(f'{path}: md5 mismatch')
              if content != (Path('rustdesk') / path).read_bytes():
                  raise SystemExit(f'{path}: differs from the payload')
              count += 1
          print(f'stored payload: {count} files verified')

          # The same trailer the shipped build carries, byte for byte.
          marker = shipped[shipped.index(b'HELPDESK-PROFILES:'):]
          exe.write_bytes(data + marker)
          data = exe.read_bytes()
          if data.count(b'HELPDESK-PROFILES:') != 1 or not data.endswith(marker):
              raise SystemExit('Stored executable marker verification failed')
          for value in ('Gesoft Support', 'GesoftSupport.exe'):
              if value.encode('utf-16-le') not in data:
                  raise SystemExit(f'{exe} lacks the version string {value}')
          for path, content in (('shipped', shipped), ('stored', data)):
              print(f'{path}: {len(content)} bytes sha256 {hashlib.sha256(content).hexdigest()}')
          PY

      - name: Upload stored executable (experimental, not for release)
        if: steps.stored.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-support-windows-x86_64-stored-experimental
          path: experimental
